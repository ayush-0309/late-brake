<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Late Brake trailer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; background: #0b0d10; color: #f3f4f6; font: 18px 'Barlow Condensed', system-ui, sans-serif; }
    header { display: flex; gap: 16px; align-items: center; padding: 12px 16px; }
    button { font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 8px; border: 0; background: #e8112d; color: #fff; cursor: pointer; }
    #status { color: #9aa1ab; }
    #out { width: min(960px, 100vw); aspect-ratio: 16 / 9; display: block; }
    /* The game's own canvases, drawn into #out each frame; kept off screen. */
    .work { position: fixed; left: -10000px; top: 0; }
  </style>
</head>
<body>
  <header>
    <button id="record">Record trailer</button>
    <span id="status">Needs the dev server and tools/trailer/save.mjs running.</span>
  </header>
  <canvas id="out" width="1920" height="1080"></canvas>
  <canvas id="game" class="work"></canvas>
  <canvas id="minimap" class="work" style="width: 200px; height: 200px"></canvas>
  <canvas id="game3d" class="work"></canvas>
  <script type="module" src="trailer.js"></script>
</body>
</html>
