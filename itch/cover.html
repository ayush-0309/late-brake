<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Late Brake itch.io cover</title>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;1,800&display=swap" rel="stylesheet">
  <style>
    /* The itch.io cover image (630 × 500). Rendered to cover.png at twice the size; the photo is screenshot-1.jpg. */
    html, body { margin: 0; }
    .cover {
      position: relative; width: 630px; height: 500px; overflow: hidden; color: #f3f4f6;
      background: url(screenshot-1.jpg) -409px -50px / 1210px auto no-repeat, #0b0d10;
    }
    .cover::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(11, 13, 16, .97) 10%, rgba(11, 13, 16, .8) 34%, rgba(11, 13, 16, 0) 60%); }
    .text { position: absolute; left: 34px; right: 34px; bottom: 30px; z-index: 1; }
    .logo { margin: 0; font: italic 800 92px/.9 'Barlow Condensed', sans-serif; }
    .logo span { color: #e8112d; }
    .tag { margin: 8px 0 0; font: 600 26px/1.15 'Barlow Condensed', sans-serif; color: #c3c8d0; }
  </style>
</head>
<body>
  <div class="cover">
    <div class="text">
      <h1 class="logo">LATE<span>BRAKE</span></h1>
      <p class="tag">Six real circuits. Free in your browser.</p>
    </div>
  </div>
</body>
</html>
